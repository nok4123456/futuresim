# DeepSeek Pro + LanceDB Search Configuration
# Usage: python scripts/run_forecast_sim.py --config configs/shared/default_deepseek_pro_search.yaml

# --- Simulation Meta ---
sim_name: 'deepseek_pro_search'
start_date: '2026-01-01' # Resolution window start (aligned with aljazeera2026Q1)
end_date: '2026-01-05' # Resolution window end
resolution_start: '2026-01-01' # Actual filtering date range
resolution_end: '2026-01-05'
lookback_days: 7
search_cutoff_days: 0
resolution_guard: null
split: 'aljazeera2026Q1'

# --- Data Paths ---
dataset: 'openforesight'
dataset_path: '${FSIM_DATASET_PATH}'
dataset_cache: '${FSIM_DATASET_CACHE}'
min_forecasters: 0
resolved_only: false
output_base: '${FSIM_OUTPUT_BASE}'

# --- Search Settings ---
# search_tool_type: "lancedb" (default, requires local corpus) or "google" (Serper.dev API).
# When using "google", search_db and embedding_model are ignored.
# Can also be set via FSIM_SEARCH_TOOL env var (takes precedence over this config).
search_tool_type: 'google'
search_db: '' # LanceDB directory; ignored for google
embedding_model: '${FSIM_EMBEDDING_MODEL}'
embedding_gpu_mem: 0.7

# --- Answer Matching (DeepSeek, using fast model to save cost) ---
matching: 'deepseek'
matcher: 'deepseek-v4-flash' # Lightweight model for answer equivalence
matcher_gpu_mem: 0.0
max_model_len: 8192

# --- Inference Defaults ---
rate_limit: 32.0
parallel: true

# --- Agents Configuration (All using DeepSeek V4 Pro) ---
defaults:
  provider: 'deepseek'
  scaffold: 'basic'
  max_actions: 5
  temperature: 0.3
  max_tokens: 2048
  max_retries: 3

agents:
  - model: 'deepseek-v4-flash' # Powerful reasoning model for forecasts
    provider: 'deepseek'
